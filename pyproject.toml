[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "everstickynote"
description = "Evernote のノートを読み取り専用の付箋として表示する Windows アプリ"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dynamic = ["version", "dependencies"]

[project.gui-scripts]
everstickynote = "everstickynote.main:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["everstickynote", "everstickynote.ui"]

[tool.setuptools.dynamic]
version = { attr = "everstickynote.__version__" }
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.package-data]
everstickynote = ["assets/*"]
